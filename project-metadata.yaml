project:
  name: Digital Farming Support Center
  type: agritech-fastapi-platform
  status: active-development
  maturity: production-hardened-prototype
  last_verified: 2026-09-01
  validated_test_command: ".venv\\Scripts\\python.exe -m pytest -q"
  test_result: 23-passed-targeted-regressions

runtime:
  language: Python
  version_target: "3.8+"
  framework: FastAPI
  persistence: SQLite
  deployment_target: local-dev-and-docker

repository:
  primary_entry: app.py
  versioned_api: digital_farming/api/v1/routes.py
  services_dir: digital_farming/services
  tests_dir: tests
  docs_dir: docs

implementation:
  current_focus: security-and-deployment-hardening
  next_priority: monitoring-and-operational-maturity
  risk_level: low-to-medium
  notes: >-
    The repo has verified security hardening for JWT expiry, RBAC enforcement,
    admin audit logging, and environment-backed deployment configuration.
    The remaining gaps are operational monitoring, deeper workflow coverage,
    and expanded production documentation.

tracked_areas:
  - app-routing
  - auth-and-rbac
  - audit-and-operations
  - agriculture-service-logic
  - market-and-traceability
  - sustainability-and-carbon
  - testing-and-validation
  - deployment-and-operations

