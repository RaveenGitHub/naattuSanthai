version: "3.9"

services:
  app:
    build: .
    container_name: digital-farming-support-center
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: "development"
      APP_DEBUG: "true"
      PORT: "8000"
      DATABASE_PATH: "/app/digital_farming.db"
      SECRET_KEY: "change-me-in-production"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRY_HOURS: "12"
      IMD_API_KEY: "${IMD_API_KEY:-}"
      IMD_API_TOKEN: "${IMD_API_TOKEN:-}"
      IMD_CITY_FORECAST_URL: "${IMD_CITY_FORECAST_URL:-https://api.imd.gov.in/api/v1/cityforecast}"
