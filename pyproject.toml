[project]
name = "digital-farming-support-center"
version = "0.2.0"
description = "Agriculture, farming, and sustainability support platform"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "pydantic==2.8.2",
  "PyJWT==2.8.0",
  "httpx==0.27.2",
  "pytest==8.3.5",
  "python-multipart==0.0.20",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
